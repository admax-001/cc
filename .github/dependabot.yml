# Dependabot 依赖更新配置
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options

version: 2
updates:
  # API 依赖（hono / wrangler）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: [dependencies]

  # 前端依赖（vue / vite / axios 等）
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: [dependencies, frontend]

  # GitHub Actions 工作流依赖
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: [dependencies, ci]
