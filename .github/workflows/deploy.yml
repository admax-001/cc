# GitHub Actions 手动部署（workflow_dispatch）
# 说明：日常部署优先走 Cloudflare Git 集成（Workers Builds，Deploy command 设为 node deploy.mjs）
# 或本地 node deploy.mjs；本工作流改为仅手动触发，避免未配置 secrets 时每次 push 都失败。
# 使用前在仓库 Settings → Secrets and variables → Actions 配置两个 secret：
#   CLOUDFLARE_API_TOKEN   —— https://dash.cloudflare.com/profile/api-tokens 创建
#                             （模板选 "Edit Cloudflare Workers" 或自定义最小权限：
#                             Workers Scripts:Edit + D1:Edit + Account:Read）
#   CLOUDFLARE_ACCOUNT_ID —— dash 右侧栏 Account ID
name: Deploy to Cloudflare Workers

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install API dependencies
        run: npm ci

      - name: One-click deploy (D1 + frontend + Worker)
        run: node deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
