# 黑小帅 V3 API —— Cloudflare Workers 配置（V3 开发线：xf）
# database_id 为占位符：node deploy.mjs 会自动查找/创建 D1 并回写真实 ID，无需手动修改。
# 部署隔离：全新 Worker xf-api + 全新 D1 库 xf，与 V1（xiaoshiliu-api）/ V2（hxs-api）并行互不影响。
# （若手动部署：先 wrangler login → wrangler d1 create xf，把返回的 database_id 填到下面）
# ⚠️ Cloudflare Git 集成（Workers Builds）部署时，Deploy command 请设为 node deploy.mjs，
#    默认的 npx wrangler deploy 无法处理占位符 database_id（D1 库找不到会报错）

name = "xf-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
APP_VERSION = "3.0.0-dev"
# JWT_SECRET 不放 vars（与 secret 同名会冲突，code 10053）：
#   生产：wrangler secret put JWT_SECRET --name xf-api
#   本地开发：写入 .dev.vars（wrangler dev 自动读取，已 gitignore）

# ---- V2 图片直传 imgbed 配置（V1 只读阶段不启用，部署 V2 前再配）----
# IMAGE_UPLOAD_STRATEGY = "imgbed-api"
# IMG_API_URL = "https://img.你的域名.com/api/upload"   # imgbed 上传接口
# IMG_BASE_URL = "https://img.你的域名.com"             # 图库域名（外链兜底白名单）
# API key 请勿写在这里，用命令单独存放：wrangler secret put IMG_API_TOKEN

[[d1_databases]]
binding = "DB"
database_name = "xf"
database_id = "local-dev-placeholder"

# ---- 前端静态资产：Vue3 构建产物（deploy.mjs 自动构建到 ./dist）----
# 同一个 Worker 同时服务博客前端 + /api 接口，无需单独 Pages 项目
# SPA 路由（如 /explore）未命中静态文件时回退 index.html
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
