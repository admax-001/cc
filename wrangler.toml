# 黑小帅 V3 API —— Cloudflare Workers 配置（V3 开发线：xf）
# database_id 已填真实值：本账号 Git 集成（Workers Builds）用默认 Deploy command
# （npx wrangler deploy）即可直接部署——dist/ 已随仓库提交，D1 库与 JWT_SECRET（持久 secret）均已存在。
# 说明：单独的 database ID 无法被用于操作数据库（需账号级 API Token），公开无安全风险。
# 全新 Cloudflare 账号一键部署（Git 集成连接本仓库）：
#   1) 连接时 Worker 名必须填 xf-api（与下方 name 一致，否则 JWT_SECRET 注入步骤会找错 Worker）
#   2) Deploy command 改为 node deploy.mjs（默认命令不会建库，会报 D1 database not found）
#   3) “构建令牌”填自定义 API Token：Account Settings:Read + Workers Scripts:Edit + D1:Edit
#      （默认构建令牌无 D1 建库权限；database_id 无需改占位符，deploy.mjs 按库名查找/创建并回写）
# 部署隔离：全新 Worker xf-api + 全新 D1 库 xf，与 V1（xiaoshiliu-api）/ V2（hxs-api）并行互不影响。

name = "xf-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
APP_VERSION = "3.0.0-dev"
# JWT_SECRET 不放 vars（与 secret 同名会冲突，code 10053）：
#   生产：wrangler secret put JWT_SECRET --name xf-api
#   本地开发：写入 .dev.vars（wrangler dev 自动读取，已 gitignore）

# ---- V2 图片直传 imgbed 配置（CF-ImgBed 系图床，POST /upload + token 鉴权）----
# API key 用 secret 单独存放（勿写进本文件）：wrangler secret put IMG_API_TOKEN
# 令牌在图库后台"管理→API令牌"生成；未设置 secret 时自动回退 picsum 占位图，发布流程不断
IMAGE_UPLOAD_STRATEGY = "imgbed-api"
IMG_API_URL = "https://tk.wyzshy.dpdns.org/upload"   # 图床上传接口
IMG_BASE_URL = "https://tk.wyzshy.dpdns.org"         # 图床域名（相对路径拼接 /file/xxx.png）

[[d1_databases]]
binding = "DB"
database_name = "xf"
database_id = "94e5aab1-bd1c-4989-bbbf-891a0be6aeaf"

# ---- 前端静态资产：Vue3 构建产物（deploy.mjs 自动构建到 ./dist）----
# 同一个 Worker 同时服务博客前端 + /api 接口，无需单独 Pages 项目
# SPA 路由（如 /explore）未命中静态文件时回退 index.html
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
